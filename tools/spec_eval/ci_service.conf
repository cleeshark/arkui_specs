# ci_service.conf — deployment-local configuration for ci_service.sh
#
# Sourced by ci_service.sh at startup. Keep site/host URLs here instead of
# hardcoding them in the script. Values use ${VAR:-default} so an env var
# already exported takes precedence over this file. Point CI_SERVICE_CONF at a
# different path to use another config.

# Public origin (scheme://host:port) the site + per-delivery CI archives are
# reachable at from a PR author's browser (here: frp reverse proxy). Combined
# with CI_SITE_BASE_PATH to build the "Full report" links in PR comments.
# Leave empty to omit the link.
CI_PUBLIC_ORIGIN="${CI_PUBLIC_ORIGIN:-http://121.43.52.4:6003}"

# URL path the site + archives are served under (must match the webhook
# --site-base-path). Default /arkui_specs.
# CI_SITE_BASE_PATH="${CI_SITE_BASE_PATH:-/arkui_specs}"
