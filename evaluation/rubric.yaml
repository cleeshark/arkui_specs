schema_version: 1
rubric_version: 0.2.0
status: candidate
evaluation_unit: function
description: >-
  ArkUI Function-level semantic evaluation protocol. The score starts from 100
  and only evidence-backed defects may deduct points. Static findings remain
  authoritative and semantic evaluation cannot remove or downgrade them.

approval:
  freeze_state: pilot_single_confirmation
  confirmation_mode: single
  note: Engineering protocol is implemented; each reference evaluation is confirmed once before commit.

protocol_compatibility:
  complexity_rules_version: 0.2.0
  design_completeness_rules_version: 0.1.0
  semantic_result_schema_version: 1
  score_result_schema_version: 1
  evaluation_report_schema_version: 1
  evaluator_protocol_versions: [0.2.0]
  aggregator_protocol_versions: [0.1.0]

score_model:
  method: deduction
  total_score: 100
  dimension_floor: 0
  rounding:
    mode: half_up
    precision: 2
    apply_at: [criterion, dimension, total, confidence]
  finding_accumulation:
    identity_fields: [criterion_id, claim_id, normalized_problem]
    duplicate_policy: keep_highest_deduction
    criterion_policy: sum_unique_then_cap_at_criterion_max
    dimension_policy: sum_criterion_scores_then_normalize
  not_applicable:
    requires: [applicability_reason, evidence]
    denominator_policy: exclude_criterion_max_score
    dimension_normalization: normalize_to_dimension_weight
    minimum_applicable_criterion_ratio: 0.5
    below_minimum_policy: mark_dimension_not_verifiable
  not_verifiable:
    deduction: 0
    denominator_policy: include_criterion_max_score
    confidence_component: evidence_verification_coverage
  forbidden_positive_factors:
    - document_length
    - table_count
    - diagram_count
    - citation_count
    - checked_self_audit_boxes

semantic_conclusions:
  - SUPPORTED
  - PARTIALLY_SUPPORTED
  - CONTRADICTED
  - MISSING
  - NOT_APPLICABLE
  - NOT_VERIFIABLE

evidence_policy:
  evidence_types:
    - source_citation
    - sdk_declaration
    - spec_location
    - design_location
    - static_finding
    - registry_entry
    - test_evidence
    - review_record
  reproducible_evidence_requires: [path, source_revision, content_hash]
  critical_major_requires:
    minimum_evidence_items: 1
    content_hash_required: true
    reason_required: true
    recommendation_required: true

publishing_caps:
  selection: strictest_active_unexempted_severity
  formula: published_score = min(raw_score, active_cap)
  caps:
    Critical: 39
    Major: 59
    Minor: 79
    None: 100

gate_authority:
  order: [pass, warn, fail, error]
  effective_gate: max(static_gate, semantic_gate)
  static_findings_authoritative: true
  semantic_may_remove_static_finding: false
  semantic_may_downgrade_static_gate: false

confidence:
  formula: weighted_sum
  range: [0, 1]
  components:
    evidence_verification_coverage:
      weight: 0.4
      calculation: verified_required_evidence_units / required_evidence_units
      zero_denominator: 0
    human_confirmation:
      weight: 0.3
      calculation: confirmed_evaluation / required_confirmation
      unconfirmed_value: 0
    source_revision_reproducibility:
      weight: 0.2
      calculation: reproducible_evidence_items / evidence_items
      zero_denominator: 0
    tool_execution_completeness:
      weight: 0.1
      calculation: completed_required_stages / required_stages
      required_stages: [static, evidence, semantic, score]
  publishable_requires:
    all_required_stages_complete: true

admission:
  statuses: [NOT_READY, BASELINED, HIGH_QUALITY]
  BASELINED:
    all_gates_pass: true
    minimum_published_score: 80
    minimum_confidence: 0.8
  HIGH_QUALITY:
    all_gates_pass: true
    minimum_published_score: 90
    minimum_confidence: 0.85

dimensions:
  - id: correctness
    name: 事实正确性与证据
    weight: 30
    criteria:
      - id: CORRECTNESS-SOURCE-SUPPORT
        name: 源码事实支持度
        evaluator: semantic
        max_score: 12
        allow_not_applicable: false
        required_evidence_types: [source_citation]
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 5, severity: Major}
          CONTRADICTED: {deduction: 12, severity: Critical}
          MISSING: {deduction: 12, severity: Critical}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}
      - id: CORRECTNESS-SDK-CONTRACT
        name: SDK与接口契约一致性
        evaluator: hybrid
        max_score: 6
        allow_not_applicable: true
        required_evidence_types: [sdk_declaration, source_citation]
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 3, severity: Major}
          CONTRADICTED: {deduction: 6, severity: Critical}
          MISSING: {deduction: 6, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}
      - id: CORRECTNESS-BOUNDARY-STATE
        name: 边界、状态与异常分支准确性
        evaluator: semantic
        max_score: 6
        allow_not_applicable: false
        required_evidence_types: [source_citation, test_evidence]
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 3, severity: Major}
          CONTRADICTED: {deduction: 6, severity: Major}
          MISSING: {deduction: 6, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}
      - id: CORRECTNESS-CROSS-DOC-CONSISTENCY
        name: Spec、Design与Registry一致性
        evaluator: hybrid
        max_score: 6
        allow_not_applicable: false
        required_evidence_types: [spec_location, design_location, registry_entry]
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 3, severity: Major}
          CONTRADICTED: {deduction: 6, severity: Major}
          MISSING: {deduction: 6, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}

  - id: spec_executability
    name: Spec可执行性
    weight: 25
    criteria:
      - id: SPEC-AC-TESTABILITY
        name: AC可测试与可观测性
        evaluator: semantic
        max_score: 8
        allow_not_applicable: false
        required_evidence_types: [spec_location, source_citation, test_evidence]
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 4, severity: Major}
          CONTRADICTED: {deduction: 8, severity: Major}
          MISSING: {deduction: 8, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}
      - id: SPEC-RULE-COMPLETENESS
        name: 规则与边界完整性
        evaluator: semantic
        max_score: 6
        allow_not_applicable: false
        required_evidence_types: [spec_location, source_citation]
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 3, severity: Major}
          CONTRADICTED: {deduction: 6, severity: Major}
          MISSING: {deduction: 6, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}
      - id: SPEC-TRACEABILITY
        name: AC、Rule、VM与证据闭环
        evaluator: hybrid
        max_score: 6
        allow_not_applicable: false
        required_evidence_types: [static_finding, spec_location]
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 3, severity: Major}
          CONTRADICTED: {deduction: 6, severity: Major}
          MISSING: {deduction: 6, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}
      - id: SPEC-SCOPE-BOUNDARY
        name: 范围与不涉及项清晰度
        evaluator: semantic
        max_score: 5
        allow_not_applicable: false
        required_evidence_types: [spec_location, design_location]
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 2.5, severity: Major}
          CONTRADICTED: {deduction: 5, severity: Major}
          MISSING: {deduction: 5, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}

  - id: design_quality
    name: Design设计质量
    weight: 25
    criteria:
      - id: DESIGN-IMPLEMENTATION-PATH
        name: 架构上下文与分层调用链
        evaluator: semantic
        max_score: 4
        allow_not_applicable: false
        required_evidence_types: [design_location, source_citation, registry_entry]
        coverage_scope: function
        required_checks:
          - DESIGN-CONTEXT-REPOSITORIES
          - DESIGN-CONTEXT-MODULE-RESPONSIBILITIES
          - DESIGN-LAYER-END-TO-END
          - DESIGN-LAYER-BOUNDARIES
        outcome_policy:
          SUPPORTED: 所有适用仓、模块、分层和职责边界均由Design覆盖且与冻结源码一致
          PARTIALLY_SUPPORTED: 主链存在但遗漏部分适用模块、加载入口、分层或职责边界
          CONTRADICTED: Design中的主调用方向、模块职责或分层关系与冻结源码冲突
          MISSING: 缺少可识别的架构上下文或端到端分层调用链
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 2, severity: Major}
          CONTRADICTED: {deduction: 4, severity: Critical}
          MISSING: {deduction: 4, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}
      - id: DESIGN-FEAT-RUNTIME-COVERAGE
        name: 逐Feat端到端运行设计覆盖
        evaluator: semantic
        max_score: 5
        allow_not_applicable: false
        required_evidence_types: [design_location, spec_location, source_citation, registry_entry]
        coverage_scope: per_registered_feature
        required_checks:
          - DESIGN-FEAT-INPUT-ENTRY
          - DESIGN-FEAT-STATE-UPDATE
          - DESIGN-FEAT-CORE-PROCESS
          - DESIGN-FEAT-OUTPUT-EVENT
          - DESIGN-FEAT-EXCEPTION-RECOVERY
          - DESIGN-FEAT-TEST-HANDOFF
        outcome_policy:
          SUPPORTED: 每个已注册非Deprecated Feat均覆盖输入、状态、核心处理、输出、异常恢复和测试衔接
          PARTIALLY_SUPPORTED: 所有Feat均可定位但至少一个Feat缺少一个或多个关键运行环节
          CONTRADICTED: Feat运行流程与Spec或冻结源码存在实质冲突
          MISSING: 至少一个已注册Feat没有可识别的详细运行设计，或仅存在标题/摘要
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 2.5, severity: Major}
          CONTRADICTED: {deduction: 5, severity: Major}
          MISSING: {deduction: 5, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}
      - id: DESIGN-ALGORITHM-DATA-STATE
        name: 关键算法、数据与状态设计
        evaluator: semantic
        max_score: 4
        allow_not_applicable: false
        required_evidence_types: [design_location, source_citation]
        coverage_scope: function_and_feature
        required_checks:
          - DESIGN-ALGORITHM-MAIN-BRANCHES
          - DESIGN-DATA-MODEL-LIFECYCLE
          - DESIGN-STATE-TRANSITIONS
          - DESIGN-RESOURCE-OWNERSHIP
          - DESIGN-THREAD-CONCURRENCY
          - DESIGN-FAILURE-RECOVERY
        outcome_policy:
          SUPPORTED: 所有适用算法、数据生命周期、状态、资源、线程和恢复机制均有准确设计
          PARTIALLY_SUPPORTED: 核心算法存在但至少一个适用的数据、状态、资源、并发或恢复设计不完整
          CONTRADICTED: 关键算法、状态转换或资源生命周期与冻结源码冲突
          MISSING: 对以算法或状态为核心的Function缺少关键算法、数据或状态设计
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 2, severity: Major}
          CONTRADICTED: {deduction: 4, severity: Critical}
          MISSING: {deduction: 4, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}
      - id: DESIGN-DECISION-QUALITY
        name: ADR候选方案与取舍质量
        evaluator: semantic
        max_score: 4
        allow_not_applicable: true
        required_evidence_types: [design_location, source_citation, review_record]
        coverage_scope: function_and_feature
        required_checks:
          - DESIGN-ADR-KEY-DECISIONS
          - DESIGN-ADR-REAL-ALTERNATIVES
          - DESIGN-ADR-TRADEOFF-CRITERIA
          - DESIGN-ADR-COMPATIBILITY-COST
          - DESIGN-ADR-VALIDATION
        outcome_policy:
          SUPPORTED: 关键决策具有真实候选方案、适用条件、成本、兼容性、取舍理由和验证依据
          PARTIALLY_SUPPORTED: ADR存在但候选、成本、适用条件或验证依据不完整
          CONTRADICTED: 已选择方案或取舍依据与冻结实现事实冲突
          MISSING: 适用复杂度要求ADR但没有实质性决策记录
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 2, severity: Major}
          CONTRADICTED: {deduction: 4, severity: Major}
          MISSING: {deduction: 4, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}
      - id: DESIGN-IMPACT-COVERAGE
        name: 构建、产物、注册与部署影响
        evaluator: semantic
        max_score: 3
        allow_not_applicable: false
        required_evidence_types: [design_location, source_citation, registry_entry]
        coverage_scope: function
        required_checks:
          - DESIGN-BUILD-TARGETS
          - DESIGN-BUILD-CONDITIONS
          - DESIGN-DEPENDENCIES
          - DESIGN-OUTPUT-ARTIFACTS
          - DESIGN-REGISTRATION-LOADING
          - DESIGN-DEPLOYMENT-PACKAGING
        outcome_policy:
          SUPPORTED: 适用的构建目标、条件、依赖、产物、注册、加载和部署路径均完整准确
          PARTIALLY_SUPPORTED: 说明了变更影响但遗漏一个或多个存量构建、产物、注册、加载或部署环节
          CONTRADICTED: 构建、依赖、产物或加载结论与冻结源码冲突
          MISSING: 适用Function没有可识别的构建部署设计，或仅写本次不修改BUILD文件
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 1.5, severity: Major}
          CONTRADICTED: {deduction: 3, severity: Major}
          MISSING: {deduction: 3, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}
      - id: DESIGN-VERIFICATION-PLAN
        name: 验证方案与风险闭环
        evaluator: semantic
        max_score: 5
        allow_not_applicable: false
        required_evidence_types: [design_location, test_evidence]
        coverage_scope: function_and_feature
        required_checks:
          - DESIGN-VERIFY-FEAT-AC-MAPPING
          - DESIGN-VERIFY-BUILD-TARGET
          - DESIGN-VERIFY-TEST-BINARY
          - DESIGN-VERIFY-CASE-OR-FILTER
          - DESIGN-VERIFY-EXPECTED-RESULT
          - DESIGN-VERIFY-FAILURE-RECOVERY
          - DESIGN-VERIFY-RISK-CLOSURE
        outcome_policy:
          SUPPORTED: 验证方案可执行且覆盖Feat、AC、关键算法、异常恢复和风险关闭
          PARTIALLY_SUPPORTED: 存在验证方向但缺少命令、target、用例、预期结果或覆盖映射
          CONTRADICTED: 验证入口、目标或预期结果与实际构建测试资产冲突
          MISSING: 缺少可执行验证方案或无法支撑关键设计结论
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 2.5, severity: Major}
          CONTRADICTED: {deduction: 5, severity: Major}
          MISSING: {deduction: 5, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}

  - id: compatibility_system_impact
    name: 兼容性与系统影响
    weight: 10
    criteria:
      - id: COMPATIBILITY-API-VERSION
        name: API版本、开放范围与兼容性
        evaluator: hybrid
        max_score: 4
        allow_not_applicable: true
        required_evidence_types: [sdk_declaration, spec_location, design_location]
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 2, severity: Major}
          CONTRADICTED: {deduction: 4, severity: Major}
          MISSING: {deduction: 4, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}
      - id: COMPATIBILITY-SYSTEM-IMPACT
        name: 系统能力、权限与外部依赖影响
        evaluator: semantic
        max_score: 3
        allow_not_applicable: true
        required_evidence_types: [design_location, source_citation, registry_entry]
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 1.5, severity: Major}
          CONTRADICTED: {deduction: 3, severity: Major}
          MISSING: {deduction: 3, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}
      - id: COMPATIBILITY-MULTI-DEVICE
        name: 多设备与多形态差异
        evaluator: semantic
        max_score: 3
        allow_not_applicable: true
        required_evidence_types: [spec_location, design_location, source_citation]
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 1.5, severity: Major}
          CONTRADICTED: {deduction: 3, severity: Major}
          MISSING: {deduction: 3, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}

  - id: maintainability
    name: 可维护性
    weight: 10
    criteria:
      - id: MAINTAINABILITY-EVIDENCE-STABILITY
        name: 证据稳定性与可复现性
        evaluator: hybrid
        max_score: 4
        allow_not_applicable: false
        required_evidence_types: [source_citation, sdk_declaration, static_finding]
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 2, severity: Major}
          CONTRADICTED: {deduction: 4, severity: Major}
          MISSING: {deduction: 4, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}
      - id: MAINTAINABILITY-STRUCTURE
        name: 增量结构与重复信息控制
        evaluator: hybrid
        max_score: 3
        allow_not_applicable: false
        required_evidence_types: [spec_location, design_location, static_finding]
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 1.5, severity: Minor}
          CONTRADICTED: {deduction: 3, severity: Major}
          MISSING: {deduction: 3, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}
      - id: MAINTAINABILITY-RISK-OWNERSHIP
        name: 风险、开放问题与责任闭环
        evaluator: semantic
        max_score: 3
        allow_not_applicable: false
        required_evidence_types: [design_location, review_record]
        outcomes:
          SUPPORTED: {deduction: 0}
          PARTIALLY_SUPPORTED: {deduction: 1.5, severity: Minor}
          CONTRADICTED: {deduction: 3, severity: Major}
          MISSING: {deduction: 3, severity: Major}
          NOT_APPLICABLE: {deduction: 0, exclude_from_denominator: true}
          NOT_VERIFIABLE: {deduction: 0, confidence_penalty: true}
