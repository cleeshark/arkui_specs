  - rule_id: SPEC-STRUCT-H1-001
    checker: SpecStructureChecker
    calibration_class: legacy_debt
    applies_to: [spec]
    prerequisites: [文档可解析]
    suppress_when: []
    default_severity: Major
    recommended_gate: fail
    legacy_policy: baseline_only
    owner: spec-eval

  - rule_id: DESIGN-STRUCT-ADR-FEAT-001
    checker: DesignStructureChecker
    calibration_class: stable_hard
    applies_to: [design]
    prerequisites: [增量 ADR ID 可解析, Feature Registry 可读取]
    suppress_when: [DESIGN-STRUCT-ADR-ID-001]
    default_severity: Major
    recommended_gate: fail
    legacy_policy: baseline_only
    owner: spec-eval

  - rule_id: DESIGN-STRUCT-H2-ORDER-001
    checker: DesignStructureChecker
    calibration_class: legacy_debt
