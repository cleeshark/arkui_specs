  - criterion_id: CORRECTNESS-SDK-CONTRACT
    dimension_id: correctness
    applicability: APPLICABLE
    conclusion: CONTRADICTED
    reason: >-
      Dynamic模块级matchMediaSync在SDK中明确自API 18废弃，并要求迁移到UIContext.getMediaQuery().matchMediaSync；
      Spec和Design却均声明“变更/废弃API：无”，且没有形成API 7至17、API 18起及UIContext API 10起的迁移矩阵。
      用户确认Static的Public入口确实由UIContext.static.d.ets中的MediaQuery类提供，撤销“Static不存在Public matchMediaSync”的原判断；
      Static内部继承结构差异只作为未验证实现风险，不作为本Criterion的确定冲突依据。
    claim_ids: [MEDIA-01]
    evidence: [*ev_spec, *ev_design, *ev_sdk_dynamic, *ev_sdk_ui_dynamic, *ev_sdk_static, *ev_sdk_ui_static]
    findings:
    - finding_id: SEM-042001000000000000000002
      criterion_id: CORRECTNESS-SDK-CONTRACT
      severity: Critical
      conclusion: CONTRADICTED
      message: 文档将Dynamic模块级matchMediaSync记录为无废弃API，与SDK自API 18废弃并迁移至UIContext的公开契约直接冲突。
      recommendation: 明确Dynamic API 7至17的模块入口、API 10起UIContext入口及API 18起的废弃迁移关系；Static API 23继续定位到UIContext.MediaQuery。
      evidence_ids: [EV-04-20-01-SPEC, EV-04-20-01-DESIGN, EV-04-20-01-SDK-DYNAMIC, EV-04-20-01-SDK-UI-DYNAMIC, EV-04-20-01-SDK-UI-STATIC]

  - criterion_id: CORRECTNESS-BOUNDARY-STATE
    dimension_id: correctness
    applicability: APPLICABLE
    conclusion: PARTIALLY_SUPPORTED
    reason: >-
      参数数、字符串类型和长度、重复callback、指定或全部注销等主体边界受NAPI/ANI源码支持；
      但Spec没有明确空条件、非法语法、未知Feature、width或height未初始化均返回false，也遗漏Dynamic不能在UIAbility声明或生命周期使用、
      UIContext歧义限制以及注册回调内不能调用on/off等SDK边界，Static对象字段和资源生命周期也缺少可执行验证。
    claim_ids: [MEDIA-03, MEDIA-04, MEDIA-05, MEDIA-06]
    evidence: [*ev_spec, *ev_sdk_dynamic, *ev_napi, *ev_queryer, *ev_static_ets, *ev_ani, *ev_test_query]
    findings:
    - finding_id: SEM-042001000000000000000003
      criterion_id: CORRECTNESS-BOUNDARY-STATE
      severity: Major
      conclusion: PARTIALLY_SUPPORTED
      message: 查询失败语义、UIContext使用限制、回调内on/off限制及Static对象生命周期没有形成完整准确的边界规则。
      recommendation: 将查询返回false的各类条件、Dynamic上下文限制和Static资源生命周期分别补成AC、Rule和VM。
      evidence_ids: [EV-04-20-01-SPEC, EV-04-20-01-SDK-DYNAMIC, EV-04-20-01-SRC-QUERYER, EV-04-20-01-SRC-ANI]

  - criterion_id: CORRECTNESS-CROSS-DOC-CONSISTENCY
    dimension_id: correctness
    applicability: APPLICABLE
    conclusion: SUPPORTED
    reason: >-
      Function与单Feat的ID、标题、路径和Baselined状态在Registry、Spec和Design中一致；Spec与Design也采用同一Dynamic、Static、UIContext和查询核心分层口径。
      两份文档共同遗漏废弃迁移和详细语法属于事实及完整性问题，不构成彼此之间的文档冲突。
    claim_ids: []
    evidence: [*ev_spec, *ev_design, *ev_registry_function, *ev_registry_feature]
    findings: []

  - criterion_id: SPEC-AC-TESTABILITY
    dimension_id: spec_executability
    applicability: APPLICABLE
    conclusion: PARTIALLY_SUPPORTED
    reason: >-
      6个AC均使用WHEN/THEN并具有可观察的matches、media、回调、去重和注销结果；但AC-1.2只写“实现支持的数值比较和媒体特征”，
      未展开合法语法、单位、组合、优先关系和非法条件结果，AC-1.3又只描述Dynamic NAPI边界。
      VM没有真实target、二进制、Suite.Case或精确断言，现有测试也不覆盖NAPI/ANI Listener生命周期。
    claim_ids: [MEDIA-06, MEDIA-08, MEDIA-10]
    evidence: [*ev_spec, *ev_queryer, *ev_test_build, *ev_test_query, *ev_test_core]
    findings:
    - finding_id: SEM-042001000000000000000004
      criterion_id: SPEC-AC-TESTABILITY
      severity: Major
      conclusion: PARTIALLY_SUPPORTED
      message: AC可观察但查询语法过于概括，Listener生命周期又没有可执行测试资产，不能直接转化为稳定自动化断言。
      recommendation: 按语法类别拆分AC，列出每类输入与精确结果，并映射到真实target、测试二进制和具体用例。
      evidence_ids: [EV-04-20-01-SPEC, EV-04-20-01-SRC-QUERYER, EV-04-20-01-TEST-BUILD, EV-04-20-01-TEST-QUERY, EV-04-20-01-TEST-CORE]

  - criterion_id: SPEC-RULE-COMPLETENESS
    dimension_id: spec_executability
    applicability: APPLICABLE
    conclusion: PARTIALLY_SUPPORTED
    reason: >-
      R-1至R-6覆盖结果快照、媒体特征、NAPI异常、注册、去重和注销主体；用户确认MediaQuery语法与解析是本Function的重点，
      当前R-2没有展开CSS Level 3/4形式、比较运算符、单位差异、screen/only/not/and/or/逗号组合、大小写、default映射、
      空条件、非法语法、未知Feature、未初始化宽高和缓存语义，Design中的解析算法同样不完整。
    claim_ids: [MEDIA-05, MEDIA-06]
    evidence: [*ev_spec, *ev_design, *ev_queryer, *ev_test_query]
    findings:
    - finding_id: SEM-042001000000000000000005
      criterion_id: SPEC-RULE-COMPLETENESS
      severity: Major
      conclusion: PARTIALLY_SUPPORTED
