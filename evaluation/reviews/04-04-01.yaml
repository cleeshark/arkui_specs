  - criterion_id: CORRECTNESS-SDK-CONTRACT
    dimension_id: correctness
    applicability: APPLICABLE
    conclusion: CONTRADICTED
    reason: >-
      用户确认允许将冻结实现固化为规格并将偏差作为Accepted风险：普通ON_TOUCH的pressure、tilt和area忽略pointerIndex，
      Native历史多点共享坐标和面积退化，非插值history末项与当前点重复，live/history pressure入口输出不同；但这些行为分别与
      Native目标触点语义、历史双索引语义、Dynamic历史点说明和无量纲pressure公开契约存在直接偏差，接受处置不消除SDK契约冲突。
    claim_ids: [TOUCH-01, TOUCH-02, TOUCH-03, TOUCH-04]
    evidence: [*ev_feat3, *ev_design, *ev_sdk_dynamic, *ev_sdk_native, *ev_ui_input, *ev_node_modifier, *ev_touch_actuator, *ev_js_touch, *ev_static_touch, *ev_frame_touch]
    findings:
    - finding_id: SEM-040401000000000000000002
      criterion_id: CORRECTNESS-SDK-CONTRACT
      severity: Critical
      conclusion: CONTRADICTED
      message: 四类已确认固化行为与公开SDK的pointerIndex、历史点和pressure契约存在可观察偏差。
      recommendation: 保留当前行为AC和Accepted兼容风险，同时明确每个偏差的适用入口、版本、信息损失和禁止推导项，避免被解释为SDK统一语义。
      evidence_ids: [EV-04-04-01-SPEC-FEAT-03, EV-04-04-01-SDK-DYNAMIC, EV-04-04-01-SDK-NATIVE, EV-04-04-01-SRC-UI-INPUT, EV-04-04-01-SRC-NODE-MODIFIER, EV-04-04-01-SRC-TOUCH-ACTUATOR]

  - criterion_id: CORRECTNESS-BOUNDARY-STATE
    dimension_id: correctness
    applicability: APPLICABLE
    conclusion: CONTRADICTED
    reason: >-
      大部分注册、传播、空列表、10点上限、历史20乘10和错误状态边界可由源码支持；但AC-4.1规定普通高级getter忽略任意pointerIndex，
      AC-4.4又把索引越界统一描述为错误，二者内部冲突，实际只有真正使用索引的ByIndex getter才校验越界；AC-3.2还错误统一了两套重采样边界。
