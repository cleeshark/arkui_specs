      conclusion: CONTRADICTED
      message: AC-4.4的统一越界错误与AC-4.1及测试锁定行为冲突，重采样拒绝边界也不是两条路径的共同条件。
      recommendation: 将忽略索引的pressure、tilt、area与真正ByIndex getter分开写错误规则，并拆分常规和加速重采样边界。
